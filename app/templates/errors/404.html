{% extends "base.html" %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
  <div style="max-width: 480px;">
    <div style="font-size: 72px; font-weight: 900; color: var(--primary); line-height: 1;">404</div>
    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin: 16px 0 8px;">Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;">The page or resource you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}

{% block public_content %}
<div class="auth-page">
  <div class="auth-card" style="text-align: center;">
    <div style="font-size: 64px; font-weight: 900; color: var(--primary); line-height: 1;">404</div>
    <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main); margin: 16px 0 8px;">Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">The page you are looking for doesn't exist.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
