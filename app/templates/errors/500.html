{% extends "base.html" %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
  <div style="max-width: 480px;">
    <div style="font-size: 72px; font-weight: 900; color: var(--warning); line-height: 1;">500</div>
    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin: 16px 0 8px;">Internal Server Error</h2>
    <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;">Something went wrong on our end. Please try again or return to the dashboard.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
